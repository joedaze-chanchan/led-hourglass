<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LED 모래시계</title>
<meta name="description" content="시·분·초가 60진법으로 물려 도는 LED 모래시계 타이머">
<meta name="theme-color" content="#14151a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모래시계">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400&display=swap">
<style>
  /* 사진 속 실물 LED 모듈을 옮긴 화면이라 '어두운 방에 놓인 흰 모듈' 한 가지 세계로
     고정한다. 테마를 따라가지 않는 대신 모든 색을 명시적으로 칠한다. */
  :root {
    --방: #14151a;
    --방아래: #0c0d11;
    --모듈: #f2f0ec;
    --모듈그늘: #d9d5cd;
    --꺼진알: #23262c;
    --글: #e9ecf2;
    --흐린글: #8a91a0;
    --버튼: #1d2027;
    --버튼테: #333844;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* 노치와 제스처바를 피한다 — 전체화면으로 뜨는 앱이므로 직접 챙겨야 한다 */
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    margin: 0;
    background: linear-gradient(180deg, var(--방) 0%, var(--방) 52%, var(--방아래) 100%);
    color: var(--글);
    font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* 앱처럼: 화면을 꽉 채우고 페이지가 스크롤되지 않는다.
     판은 남는 공간에 맞춰 알아서 줄고, 조작은 엄지가 닿는 아래쪽에 모은다. */
  main {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 14px;
    overflow: hidden;
  }

  #시각 {
    font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    font-weight: 200; font-size: clamp(30px, 10vw, 44px);
    font-variant-numeric: tabular-nums; letter-spacing: 2px; line-height: 1;
    flex: none;
  }

  /* 판이 들어앉는 자리. 남는 높이를 전부 가져가고, 넘치면 잘라낸다. */
  #무대 {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #띄울것 {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    transform-origin: center center;
  }

  #줄 { display: flex; gap: 10px; align-items: flex-end; justify-content: center; }
  .칸 { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .칸[hidden] { display: none; }
  .모듈 {
    position: relative;
    background: linear-gradient(160deg, var(--모듈) 0%, var(--모듈) 62%, var(--모듈그늘) 100%);
    border-radius: 16px; padding: 9px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .8);
  }
  .모듈::after {
    content: ""; position: absolute; left: 50%; bottom: -24px;
    width: 150%; height: 44px; transform: translateX(-50%);
    background: radial-gradient(ellipse at center, var(--빛) 0%, transparent 72%);
    opacity: .75; filter: blur(9px); pointer-events: none;
  }
  canvas { display: block; }
  .이름 { font-size: 11px; letter-spacing: 5px; color: var(--글); position: relative; z-index: 1; }

  .줄모음 { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  #아래판 { flex: none; display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; }

  button {
    font: inherit; font-size: 15px; cursor: pointer;
    background: var(--버튼); color: var(--글);
    border: 1px solid var(--버튼테); border-radius: 12px;
    padding: 0 18px; min-height: 46px;       /* 엄지로 누를 수 있는 크기 */
    touch-action: manipulation;
  }
  button:hover:not(:disabled) { border-color: #4d5566; }
  button:disabled { opacity: .35; cursor: default; }
  button[aria-pressed="true"] { background: #2f3a4e; border-color: #5a6b87; }
  button:focus-visible, input:focus-visible { outline: 2px solid #6b7e9e; outline-offset: 2px; }
  #조작 button { flex: 1 1 0; max-width: 140px; }
  #조작 { width: 100%; max-width: 380px; flex-wrap: nowrap; }
  #길이 button { font-size: 14px; padding: 0 14px; min-height: 40px; }

  .보조 { font-size: 12px; color: var(--흐린글); }
  .배속 { display: flex; align-items: center; gap: 8px; }
  .배속 input { width: 108px; }
  .배속 b { font-family: "IBM Plex Mono", monospace; color: var(--글); min-width: 40px; }
  #띄우기 { font-size: 13px; min-height: 40px; padding: 0 14px; }

  details { width: 100%; max-width: 420px; }
  summary {
    font-size: 12px; color: var(--흐린글); cursor: pointer;
    list-style: none; text-align: center; padding: 4px 0;
  }
  summary::-webkit-details-marker { display: none; }
  details p {
    font-size: 12px; line-height: 1.7; color: var(--흐린글);
    margin: 6px 0 0; text-align: center;
  }
  details em { font-style: normal; color: var(--글); }

  @media (prefers-reduced-motion: reduce) { .모듈::after { filter: none; } }
</style>

</head>
<body>
<main>
  <div id="시각">1:00:00</div>

  <div id="무대">
    <div id="띄울것">
      <div id="줄">
        <div class="칸" id="칸시"><div class="모듈" style="--빛:#28e0a0"><canvas width="118" height="248"></canvas></div><span class="이름">시</span></div>
        <div class="칸" id="칸분"><div class="모듈" style="--빛:#ff8a3d"><canvas width="118" height="248"></canvas></div><span class="이름">분</span></div>
        <div class="칸" id="칸초"><div class="모듈" style="--빛:#4d8dff"><canvas width="118" height="248"></canvas></div><span class="이름">초</span></div>
      </div>

      <div class="줄모음" id="조작">
        <button type="button" id="시작버튼">시작</button>
        <button type="button" id="정지버튼">정지</button>
        <button type="button" id="리셋">리셋</button>
      </div>
    </div>
  </div>

  <div id="아래판">
    <div class="줄모음" id="길이">
      <button type="button" data-초="3600">1시간</button>
      <button type="button" data-초="1800">30분</button>
      <button type="button" data-초="300">5분</button>
    </div>

    <details>
      <summary>어떻게 읽나요?</summary>
      <p id="띄움안내">초 알갱이 하나가 떨어지면 <em>1초</em>입니다. 초 60개가 다 떨어지면 초는 다시 60개로 채워지고, 그때 분에서 한 알이 떨어집니다. 분 60개가 다 떨어지면 시에서 한 알이 떨어집니다.</p>
      <p>📌 띄우기는 이 판만 떼어내 다른 창 위에 고정합니다. 데스크톱 크롬·엣지에서만 됩니다.</p>
      <div class="줄모음 보조">
        <button type="button" id="띄우기">📌 띄우기</button>
        <label class="배속">배속
          <input id="배속" type="range" min="1" max="120" step="1" value="1">
          <b id="배속값">1×</b>
        </label>
      </div>
    </details>
  </div>
</main>

<script>
'use strict';

/* ── 마름모 격자 ──
   8×8 격자를 45° 돌리고 네 꼭짓점을 빼면 정확히 60칸.
   알갱이 60개가 1초 = 1칸, 1분 = 1칸으로 딱 떨어진다. */
var 변 = 8, DX = 7, DY = 7, 알반 = 3.3;
var 위꼭대기 = 8, 아래꼭대기 = 132;
var 낙하시간 = 380; // ms

function 마름모(중심x, 꼭대기y) {
  var pts = [];
  for (var r = 0; r < 변; r += 1) {
    for (var c = 0; c < 변; c += 1) {
      if ((r === 0 || r === 변 - 1) && (c === 0 || c === 변 - 1)) { continue; }
      pts.push({ x: 중심x + (c - r) * DX, y: 꼭대기y + (c + r) * DY });
    }
  }
  return pts;
}

// 위 칸의 수면이 내려가는 순서 / 아래 칸에 쌓이는 순서
function 위부터(a, b) { return a.y - b.y || a.x - b.x; }
function 아래부터(a, b) { return b.y - a.y || a.x - b.x; }

function 알(ctx, x, y, 색, 빛) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.PI / 4);
  if (빛) { ctx.shadowColor = 색; ctx.shadowBlur = 5; }
  ctx.fillStyle = 색;
  ctx.fillRect(-알반, -알반, 알반 * 2, 알반 * 2);
  ctx.restore();
}

function 칸만들기(el, 색) {
  var canvas = el.querySelector('canvas');
  var w = canvas.width, h = canvas.height;
  var ratio = window.devicePixelRatio || 1;
  canvas.width = w * ratio; canvas.height = h * ratio;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  var ctx = canvas.getContext('2d');
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  return {
    el: el, ctx: ctx, w: w, h: h, 색: 색,
    // 위 칸은 중력대로 아래쪽에 모래가 깔린다. 수면은 위에서부터 내려간다.
    위: 마름모(w / 2, 위꼭대기).sort(위부터),
    아래: 마름모(w / 2, 아래꼭대기).sort(아래부터),
    // 알갱이가 빠져나가는 곳은 사라진 자리가 아니라 목이다.
    목: { x: w / 2, y: 위꼭대기 + 14 * DY },
    남은수: 60, 떨어진수: 0, 비행: null
  };
}

function 한알떨구기(칸, 지금) {
  if (칸.남은수 <= 0) { return; }
  칸.남은수 -= 1;
  칸.비행 = { 출발: 칸.목, 도착: 칸.아래[칸.떨어진수], 시작: 지금 };
}

// 위에 남은 알과 아래에 쌓인 알의 합은 언제나 60이다.
function 칸채우기(칸, 수) {
  칸.남은수 = 수;
  칸.떨어진수 = 60 - 수;
  칸.비행 = null;
}

function 칸그리기(칸, 지금) {
  var ctx = 칸.ctx, i, N = 60;
  ctx.clearRect(0, 0, 칸.w, 칸.h);
  for (i = 0; i < N; i += 1) { 알(ctx, 칸.위[i].x, 칸.위[i].y, '#23262c', false); }
  for (i = 0; i < N; i += 1) { 알(ctx, 칸.아래[i].x, 칸.아래[i].y, '#23262c', false); }
  for (i = N - 칸.남은수; i < N; i += 1) { 알(ctx, 칸.위[i].x, 칸.위[i].y, 칸.색, true); }
  for (i = 0; i < 칸.떨어진수; i += 1) { 알(ctx, 칸.아래[i].x, 칸.아래[i].y, 칸.색, true); }

  if (칸.비행) {
    var t = (지금 - 칸.비행.시작) / 낙하시간;
    if (t >= 1) {
      칸.떨어진수 += 1;
      칸.비행 = null;
    } else {
      var e = t * t;  // 중력처럼 아래로 갈수록 빨라진다
      var p = 칸.비행.출발, q = 칸.비행.도착;
      알(ctx, p.x + (q.x - p.x) * e, p.y + (q.y - p.y) * e, 칸.색, true);
    }
  }
}

var 시칸 = 칸만들기(document.getElementById('칸시'), '#28e0a0');
var 분칸 = 칸만들기(document.getElementById('칸분'), '#ff8a3d');
var 초칸 = 칸만들기(document.getElementById('칸초'), '#4d8dff');
var 칸들 = [시칸, 분칸, 초칸];

/* 화면 위 숫자(0:29:41)의 자릿수를 그대로 판에 옮긴다. 위에 남은 알이 그 자리의
   값이고 나머지는 아래에 쌓여 있다. 29분 남았으면 시 자리는 0이므로 시 칸의
   60알은 모두 아래에 있다. */
function 자릿수(남은ms) {
  if (남은ms <= 0) { return { 시: 0, 분: 0, 초: 0 }; }
  var 총초 = Math.ceil(남은ms / 1000);
  return {
    시: Math.floor(총초 / 3600),
    분: Math.floor(총초 / 60) % 60,
    초: 총초 % 60
  };
}

function 시각글자(ms) {
  var 총초 = Math.ceil(ms / 1000);
  var h = Math.floor(총초 / 3600);
  var m = Math.floor((총초 % 3600) / 60);
  var s = 총초 % 60;
  return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

var 전체ms = 3600000;
var 남은ms = 전체ms;
var 도는중 = false;
var 직전 = 0;

var 시각el = document.getElementById('시각');
var 시작버튼 = document.getElementById('시작버튼');
var 정지버튼 = document.getElementById('정지버튼');
var 배속 = document.getElementById('배속');
var 배속값 = document.getElementById('배속값');

/* ── 창에 맞춰 크기 줄이기 ──
   캔버스를 다시 그리는 대신 통째로 축소한다. 마름모 비율과 알 간격이 그대로
   유지되고, 원래 화면이든 떠 있는 창이든 같은 코드로 맞는다. */
var 무대 = document.getElementById('무대');
var 띄울것 = document.getElementById('띄울것');
var 자연폭 = 0, 자연높이 = 0;

function 자연크기재기() {
  var 이전 = 띄울것.style.transform;
  띄울것.style.transform = 'none';
  var r = 띄울것.getBoundingClientRect();
  자연폭 = r.width; 자연높이 = r.height;
  띄울것.style.transform = 이전;
}

function 크기맞추기() {
  if (!자연폭 || !자연높이) { 자연크기재기(); }
  if (!자연폭 || !자연높이) { return; }
  var w = 무대.clientWidth - 8, h = 무대.clientHeight - 8;
  if (w <= 0 || h <= 0) { return; }
  var 배율 = Math.min(w / 자연폭, h / 자연높이, 2.4);
  if (!(배율 > 0)) { 배율 = 1; }
  띄울것.style.transform = 'scale(' + 배율.toFixed(3) + ')';
}

function 판다시세우기() {
  var v = 자릿수(남은ms);
  칸채우기(시칸, v.시);
  칸채우기(분칸, v.분);
  칸채우기(초칸, v.초);
}

function 버튼상태() {
  시작버튼.disabled = 도는중 || 남은ms <= 0;
  정지버튼.disabled = !도는중;
}

function 길이갱신() {
  var 버튼들 = document.querySelectorAll('#길이 button');
  for (var i = 0; i < 버튼들.length; i += 1) {
    var v = Number(버튼들[i].getAttribute('data-초')) * 1000;
    버튼들[i].setAttribute('aria-pressed', v === 전체ms ? 'true' : 'false');
  }
}

document.getElementById('길이').addEventListener('click', function (e) {
  var 초 = e.target && e.target.getAttribute && e.target.getAttribute('data-초');
  if (!초) { return; }
  전체ms = Number(초) * 1000;
  남은ms = 전체ms;
  도는중 = false;
  길이갱신();
  판다시세우기();
  버튼상태();
});

시작버튼.addEventListener('click', function () {
  if (도는중) { return; }
  if (남은ms <= 0) { 남은ms = 전체ms; 판다시세우기(); }
  도는중 = true;
  직전 = Date.now();
  버튼상태();
});

정지버튼.addEventListener('click', function () {
  도는중 = false;
  버튼상태();
});

document.getElementById('리셋').addEventListener('click', function () {
  남은ms = 전체ms;
  도는중 = false;
  판다시세우기();
  버튼상태();
});

// 한 자리를 목표 개수에 맞춘다. 하나 줄어든 것이면 떨어뜨리고,
// 되감김이나 큰 점프(배속)는 판을 통째로 다시 세운다.
function 자리맞추기(칸, 목표, 지금) {
  if (칸.남은수 === 목표) { return; }
  if (목표 === 칸.남은수 - 1) { 한알떨구기(칸, 지금); return; }
  칸채우기(칸, 목표);
}

/* ── 다른 창 위에 띄우기 (데스크톱 전용) ── */
var 띄우기버튼 = document.getElementById('띄우기');
var 띄움안내 = document.getElementById('띄움안내');
var 뜬창 = null;
var 제자리 = null, 제자리다음 = null;

if (!window.documentPictureInPicture) {
  띄우기버튼.disabled = true;
  띄우기버튼.textContent = '📌 띄우기 (데스크톱 전용)';
}

function 내리기() {
  if (제자리 && 무대) { 제자리.insertBefore(무대, 제자리다음); }
  띄우기버튼.textContent = '📌 띄우기';
  뜬창 = null;
  크기맞추기();
}

띄우기버튼.addEventListener('click', function () {
  if (뜬창) { try { 뜬창.close(); } catch (e) {} 내리기(); return; }
  if (!window.documentPictureInPicture) { return; }
  // 사용자 클릭 안에서 바로 열어야 브라우저가 제스처를 인정한다.
  window.documentPictureInPicture.requestWindow({ width: 420, height: 380 }).then(function (win) {
    뜬창 = win;
    var 스타일 = document.querySelectorAll('style');
    for (var i = 0; i < 스타일.length; i += 1) {
      var el = win.document.createElement('style');
      el.textContent = 스타일[i].textContent;
      win.document.head.appendChild(el);
    }
    var 덧 = win.document.createElement('style');
    덧.textContent = 'html,body{margin:0;height:100%;overflow:hidden;}' +
      'body{display:flex;align-items:center;justify-content:center;background:#14151a;}' +
      '#무대{height:100%;width:100%;}';
    win.document.head.appendChild(덧);

    제자리 = 무대.parentNode;
    제자리다음 = 무대.nextSibling;
    win.document.body.appendChild(무대);
    띄우기버튼.textContent = '📌 내리기';
    win.addEventListener('pagehide', 내리기);
    win.addEventListener('resize', 크기맞추기);
    크기맞추기();
  }).catch(function (e) {
    띄움안내.textContent = '이 브라우저에서는 띄우기가 거부되었습니다 (' +
      (e && e.name ? e.name : '알 수 없음') + '). 여기서 계속 씁니다.';
  });
});

function 루프() {
  var 지금 = Date.now();
  배속값.textContent = 배속.value + '×';
  if (도는중) {
    남은ms -= (지금 - 직전) * Number(배속.value);
    if (남은ms <= 0) { 남은ms = 0; 도는중 = false; 버튼상태(); }
  }
  직전 = 지금;

  var v = 자릿수(남은ms);
  시각el.textContent = 시각글자(남은ms);
  자리맞추기(시칸, v.시, 지금);
  자리맞추기(분칸, v.분, 지금);
  자리맞추기(초칸, v.초, 지금);
  for (var i = 0; i < 칸들.length; i += 1) { 칸그리기(칸들[i], 지금); }
  requestAnimationFrame(루프);
}

window.addEventListener('resize', 크기맞추기);

길이갱신();
판다시세우기();
버튼상태();
크기맞추기();
루프();
</script>
